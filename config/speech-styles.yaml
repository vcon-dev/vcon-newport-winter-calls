styles:
  # ages and general manner
  - Twenties, quick and casual, says like and totally, ends statements as questions sometimes.
  - Twenties, polite but unsure, apologizes for calling and checks twice that they are doing it right.
  - Late twenties, brisk and efficient, speaks in short clipped phrases, wants the answer and nothing else.
  - Thirties, harried parent, speaks fast, trails off mid-sentence when interrupted by a child.
  - Thirties, friendly and chatty, narrates their morning before getting to the point.
  - Thirties, tech-comfortable, uses abbreviations and says basically before most explanations.
  - Forties, businesslike, states the request in one sentence and then waits for the response.
  - Forties, tired and dry, understates everything with a flat wry tone.
  - Fifties, patient and measured, says let me explain and walks through events in order.
  - Fifties, impatient, sighs audibly, says as I said before even on a first call.
  - Sixties, warm and unhurried, uses dear and honey with strangers, tells small stories first.
  - Sixties, retired and thorough, reads details from a written note in a steady voice.
  - Sixties, deliberate, pauses before key words and repeats them for emphasis.
  - Seventies, soft-spoken and courteous, says pardon me often and waits to be sure they are heard.
  - Seventies, sharp and proud, corrects small errors in what the representative says.
  - Seventies, slow and careful with numbers, reads digits one at a time with pauses.
  - Eighties, speaks slowly with long pauses, loses the thread and gently picks it up again.
  - Eighties, formal and old-fashioned, uses full sentences and says kindly instead of please.
  - Eighties, hard of hearing, speaks loudly and asks for repeats with good humor.
  - Nineties, very slow and quiet, speaks in short phrases and rests between them.
  - Nineties, cheerful and wandering, drifts into remembered stories and returns apologetically.
  # structure and habits
  - Plain-spoken, short declarative sentences, says exactly what happened and stops.
  - Precise, gives dates, times and names unprompted, and corrects themselves to be exact.
  - Rambling, wanders through side stories and circles back to the point several minutes later.
  - Terse, one or two words per answer, never volunteers anything beyond the question.
  - Anxious, talks fast, repeats the same worry in different words, asks if it is okay.
  - Formal, uses complete sentences and titles, says I would like to inquire.
  - Joking, uses light sarcasm and self-deprecation to ease into the request.
  - Apologetic, begins most sentences with sorry or I know this is silly.
  - Over-explaining, gives every background detail before stating the actual question.
  - Starts in the middle of the story, assumes the representative already knows the context.
  - Answers a different question than the one asked, then catches themselves.
  - Speaks in lists, saying first, second and third, even for simple requests.
  - Repeats the representative's last few words back as a way of thinking.
  - Thinks aloud, says hmm and let me see, and changes their mind mid-sentence.
  - Hedges everything, saying I think, maybe, or sort of before every claim.
  - Direct and a little blunt, asks for the bottom line first.
  - Overly agreeable, says sure, of course and absolutely to everything, sometimes before the question ends.
  - Fills silences with ums and well, then speeds up to make up the time.
  - Speaks in a monotone, steady and unemotional, even about frustrating things.
  - Enthusiastic, high energy, uses exclamations and says great and wonderful frequently.
  - Skeptical, asks why and how do I know, and double-checks each answer.
  - Reads aloud from a document and pauses to find their place.
  - Whispers because someone is sleeping nearby, speaks in short breaths.
  - Talks softly and quickly, trailing off at the ends of sentences.
  - Tells everything in chronological order, starting with last week.
  - Jumps between topics, says oh and by the way, then returns to the first one.
  - Asks permission for each small thing, saying is it all right if I ask.
  - Uses lots of filler like you know, I mean, and right, and checks that the representative follows.
  - Gives the whole story in one long breath without pausing for response.
  - Very polite and slightly stiff, thanks the representative before and after each sentence.
  - Brusque with a hint of weariness, assumes the call will be a struggle.
  - Soft sighs between sentences, speaks as though the day has already been long.
  - Cheerfully confused, laughs at themselves when they lose track of what they were saying.
  - Methodical, asks for the representative's name first and writes down each step.
  - Talks with their hands busy, audible rustling, often distracted mid-word.
  - Emphasizes odd words, stressing the key noun in each sentence.
  - Speaks in questions, ending nearly every phrase with an upward lilt.
  - Understated, says a little bit instead of a lot, and kind of when things matter.
  - Gives opinions along with facts, adds a short editorial to each point.
  - Quotes what other people told them, saying she said and then I said.
  # Rhode Island locals
  - Lifelong Newport local, says wicked as an intensifier, relaxed pace, occasionally drops an r.
  - Older islander, says down the Point and up the Hill for neighborhoods, easy and unhurried.
  - Rhode Island local in their fifties, calls a drinking fountain a bubbler, dry and friendly.
  - Local who drops small words like the and a, speaks in clipped, practical phrases.
  - Rhode Island native, says the cabinet for a milkshake in passing and then explains.
  - Longtime resident who refers to places by what used to be there, then corrects themselves.
  - Local in their thirties, relaxed vowels, says wicked and totally in the same breath.
  - Navy family local, uses acronyms casually and sounds brisk without being cold.
  - Mid-century islander, drops an occasional r, speaks in slow, rolling sentences.
  - Rhode Islander who gives directions by landmark, saying turn at where the bank used to be.
  - Local who answers with a quick joke, then settles into a calm, practical rhythm.
  - Rhode Island local, quick and friendly, calls everyone hon and moves fast between topics.
  - Younger local, mixes slang with polite phrases, light wicked and a stretched vowel or two.
  - Gruff local who says that's the way it goes often, and speaks in short, grounded phrases.
  - Islander who tells short stories about growing up near the harbor before getting to business.
  - Local who says the avenue and the boulevard as if everyone knows which ones.
  - Rhode Island resident who says down cellar and up attic casually, plainspoken and warm.
  # non-native English speakers
  - Portuguese-speaking caller, careful and warm, rolls some vowels, sometimes translates idioms directly.
  - Brazilian Portuguese background, fluent but fast, links words together and says no way often.
  - Azorean Portuguese background, polite and formal, speaks slowly, uses a phrase from home when searching.
  - Cape Verdean Creole speaker, relaxed and musical cadence, pauses to find words, gracious toward the listener.
  - Cape Verdean background, switches briefly to Creole with a relative nearby, then returns to English.
  - Spanish-speaking caller from Central America, careful grammar, adds a polite phrase before each request.
  - Spanish-speaking caller from the Dominican Republic, quick and expressive, drops some word endings.
  - Spanish-speaking caller from Colombia, formal and courteous, uses usted-like politeness in English.
  - Spanish speaker, confident but occasionally mixes up word order, asks to confirm understanding.
  - Haitian Creole speaker, deliberate and respectful, uses simple sentences, asks to repeat to be sure.
  - Haitian background, warm and soft-spoken, drops some articles, careful with names and numbers.
  - Vietnamese speaker, polite and measured, speaks softly, sometimes omits plural endings and articles.
  - Vietnamese background, quick to thank, checks each detail aloud before moving on.
  - Arabic speaker, formal and gracious, generous with greetings, builds up slowly to the request.
  - Arabic-speaking caller, fluent but with careful stress, adds a blessing as they close.
  - Russian speaker, direct and concise, flat intonation, occasionally leaves out articles.
  - Russian background, serious and exact, speaks in full statements and expects precise answers.
  - Mandarin speaker, careful and quiet, rising tones can carry into questions, polite and brief.
  - Mandarin background, businesslike, drops some tense markers, repeats key numbers twice.
  - Polish speaker, careful and formal, long vowels, occasionally omits articles in longer sentences.
  - Polish background, dry and matter-of-fact, speaks with small pauses and thorough details.
  - Second-language English speaker, speaks slowly and rehearsed, with a written script in hand.
  - Recently arrived speaker using a family member as backup, speaks short sentences and waits for the relay.
  - Bilingual caller who code-switches mid-sentence and then apologizes for the lapse.
  - Second-language speaker who understands well but searches for spoken words, often pausing mid-thought.
  - Non-native speaker with polished vocabulary but unusual idioms, says on the other hand constantly.
  - Fluent second-language speaker with a quick pace, who occasionally asks what a phrase means.
